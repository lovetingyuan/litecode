[package]
name = "litecode"
version = "0.1.0"
description = "A lightweight native code editor"
authors = ["LiteCode contributors"]
edition = "2024"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "litecode_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
tauri-plugin-clipboard-manager = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_json_lenient = "=0.2.4"
tokio = { version = "1", features = ["process", "io-util", "sync", "time", "rt-multi-thread", "macros"] }
sha2 = "0.10"
tempfile = "3"
encoding_rs = "0.8"
walkdir = "2"
notify = "8"
git2 = { version = "0.20", default-features = false }
trash = "5"
globset = "0.4"
regex = "1"
url = "2"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls"] }
zip = { version = "9.0.4", default-features = false, features = ["deflate"] }
pcre2 = "0.2"


# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
